[project]
name = "proyecto-cripta"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["lenta: corrida a tamaño completo (spec 005 T069); se corre aparte con `-m lenta`"]
addopts = "-m 'not lenta'"
